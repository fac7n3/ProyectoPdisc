    <meta name="description" content="Servicios y números de emergencia de Baradero: policía, hospital, ambulancia, veterinarias de turno y más." />
    <title>Servicios - Baradero Local</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
      /* Acento propio por categoría, se declara con custom properties para no
         repetir cada regla de color -- .sv-card--emergencias/.sv-card--veterinarias
         solo pisan estas dos variables. */
      .sv-card { --sv-accent: var(--bl-primary); --sv-accent-soft: rgba(40, 65, 117, 0.1); }
      .sv-card--emergencias { --sv-accent: var(--bl-danger); --sv-accent-soft: rgba(239, 68, 68, 0.1); }
      .sv-card--veterinarias { --sv-accent: #0d9488; --sv-accent-soft: rgba(13, 148, 136, 0.1); }

      .sv-page { max-width: 800px; margin: 0 auto 3rem; padding: 0 1rem; }

      /* --- Hero de la página --- */
      .sv-hero {
        display: flex; align-items: center; gap: 1rem;
        margin: 1.75rem 0 1.75rem;
      }
      .sv-hero__icon {
        flex-shrink: 0; width: 3rem; height: 3rem; border-radius: var(--bl-radius-lg);
        background: var(--bl-primary); color: #fff;
        display: flex; align-items: center; justify-content: center; font-size: 1.25rem;
        box-shadow: var(--bl-shadow-md);
      }
      .sv-hero__title { font-size: 1.6rem; color: var(--bl-primary-deeper); line-height: 1.2; }
      .sv-hero__subtitle { color: var(--bl-text-secondary); font-size: 0.9rem; margin-top: 0.15rem; }

      /* --- Tarjeta por categoría --- */
      .sv-card {
        background: var(--bl-surface); border: 1px solid var(--bl-border);
        border-radius: var(--bl-radius-xl); box-shadow: var(--bl-shadow-card);
        overflow: hidden; margin-bottom: 1.5rem;
      }
      .sv-card__head {
        display: flex; align-items: center; gap: 0.85rem;
        padding: 1.1rem 1.25rem; border-bottom: 1px solid var(--bl-border-light);
        background: var(--sv-accent-soft);
      }
      .sv-card__icon {
        flex-shrink: 0; width: 2.5rem; height: 2.5rem; border-radius: 50%;
        background: var(--sv-accent); color: #fff;
        display: flex; align-items: center; justify-content: center; font-size: 1.05rem;
      }
      .sv-card__title { font-size: 1.1rem; color: var(--bl-text); line-height: 1.2; }
      .sv-card__desc { font-size: 0.8125rem; color: var(--bl-text-secondary); margin-top: 0.1rem; }

      .sv-card__list { display: flex; flex-direction: column; }
      .sv-contact {
        display: flex; align-items: center; gap: 0.75rem;
        padding: 0.9rem 1.25rem;
      }
      .sv-contact + .sv-contact { border-top: 1px solid var(--bl-border-light); }
      .sv-contact__dot {
        flex-shrink: 0; width: 0.5rem; height: 0.5rem; border-radius: 50%;
        background: var(--sv-accent); opacity: 0.55;
      }
      .sv-contact__info { flex: 1; min-width: 0; }
      .sv-contact__name { font-weight: 600; color: var(--bl-text); font-size: 0.9375rem; }
      .sv-contact__notes {
        display: block; font-size: 0.78125rem; color: var(--bl-text-secondary);
        margin-top: 0.15rem;
      }
      .sv-contact__call {
        flex-shrink: 0; display: inline-flex; align-items: center; gap: 0.4rem;
        padding: 0.5rem 0.9rem; border-radius: var(--bl-radius-pill);
        background: var(--sv-accent); color: #fff; text-decoration: none;
        font-size: 0.8125rem; font-weight: 700; white-space: nowrap;
        box-shadow: var(--bl-shadow-sm); transition: transform .15s, box-shadow .15s, opacity .15s;
      }
      .sv-contact__call:hover { transform: translateY(-1px); box-shadow: var(--bl-shadow-md); opacity: 0.92; }
      .sv-contact__call i { font-size: 0.75rem; }

      /* --- Estado vacío --- */
      .sv-empty {
        display: flex; flex-direction: column; align-items: center; gap: 0.6rem;
        text-align: center; padding: 2.5rem 1.5rem; color: var(--bl-text-secondary);
        background: var(--bl-surface); border: 1px dashed var(--bl-border);
        border-radius: var(--bl-radius-xl); font-size: 0.9375rem;
      }
      .sv-empty i { font-size: 1.75rem; color: var(--bl-text-muted); }

      @media (max-width: 480px) {
        .sv-hero { margin: 1.25rem 0 1.5rem; }
        .sv-contact { flex-wrap: wrap; row-gap: 0.6rem; }
        .sv-contact__call { margin-left: auto; }
      }
    </style>
    <script type="module" crossorigin src="/assets/servicios-B30FajWS.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/speed-insights-BYKzD-eO.js">
    <link rel="stylesheet" crossorigin href="/assets/home-O28IFI7V.css">
  </head>
  <body>
    <nav class="navbar" role="navigation" aria-label="Navegación principal">
      <div class="navbar__top">
        <a href="./home.html" class="navbar__logo">
          <img src="/assets/logoazulpng-BmcneNO6.png" alt="Baradero Local" class="navbar__logo-img" />
          <div class="navbar__logo-text">
            <span class="navbar__logo-title">Baradero Local</span>
            <span class="navbar__logo-subtitle">Baradero, más cerca que nunca</span>
          </div>
        </a>
        <div class="navbar__actions">
          <a href="./home.html" class="navbar__action-circle" aria-label="Volver al inicio"><i class="fa-solid fa-arrow-left"></i></a>
        </div>
      </div>
    </nav>

    <main class="sv-page">
      <div class="sv-hero">
        <span class="sv-hero__icon" aria-hidden="true"><i class="fa-solid fa-phone-volume"></i></span>
        <div>
          <h1 class="sv-hero__title">Servicios</h1>
          <p class="sv-hero__subtitle">Números útiles de Baradero, a mano para cuando hacen falta.</p>
        </div>
      </div>

      <!-- Poblado por js/servicios.js -->
      <div id="sv-content"></div>
    </main>

  </body>
</html>
