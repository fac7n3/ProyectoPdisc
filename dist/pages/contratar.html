<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="view-transition" content="same-origin" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' https://cdnjs.cloudflare.com https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https://*.googleusercontent.com https://*.supabase.co; connect-src 'self' https://*.supabase.co https://accounts.google.com;">
    <meta name="description" content="Contratar profesionales y técnicos de Baradero: plomeros, electricistas, clases particulares y más, por WhatsApp o teléfono." />
    <title>Contratar - Baradero Local</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
      .ct-page { max-width: 800px; margin: 0 auto 3rem; padding: 0 1rem; }

      .ct-hero { display: flex; align-items: center; gap: 1rem; margin: 1.75rem 0 1.5rem; }
      .ct-hero__icon {
        flex-shrink: 0; width: 3rem; height: 3rem; border-radius: var(--bl-radius-lg);
        background: var(--bl-primary); color: #fff;
        display: flex; align-items: center; justify-content: center; font-size: 1.25rem;
        box-shadow: var(--bl-shadow-md);
      }
      .ct-hero__title { font-size: 1.6rem; color: var(--bl-primary-deeper); line-height: 1.2; }
      .ct-hero__subtitle { color: var(--bl-text-secondary); font-size: 0.9rem; margin-top: 0.15rem; }

      .ct-search { position: relative; margin-bottom: 1.5rem; }
      .ct-search i {
        position: absolute; left: 1rem; top: 50%; transform: translateY(-50%);
        color: var(--bl-text-muted); font-size: 0.875rem;
      }
      .ct-search input {
        width: 100%; padding: 0.8rem 1rem 0.8rem 2.6rem; border: 1px solid var(--bl-border);
        border-radius: var(--bl-radius-pill); font-family: inherit; font-size: 0.9375rem;
        background: var(--bl-surface); color: var(--bl-text); box-shadow: var(--bl-shadow-sm);
      }
      .ct-search input:focus { outline: none; border-color: var(--bl-primary); }

      .ct-list { display: flex; flex-direction: column; gap: 0.85rem; }

      .ct-card {
        background: var(--bl-surface); border: 1px solid var(--bl-border);
        border-radius: var(--bl-radius-lg); box-shadow: var(--bl-shadow-card);
        padding: 1.1rem 1.25rem;
      }
      .ct-card__head { display: flex; align-items: baseline; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap; }
      .ct-card__name { font-weight: 700; color: var(--bl-text); font-size: 1rem; }
      .ct-card__specialty {
        display: inline-block; margin-top: 0.3rem;
        padding: 0.2rem 0.65rem; border-radius: var(--bl-radius-pill);
        background: rgba(40, 65, 117, 0.1); color: var(--bl-primary);
        font-size: 0.75rem; font-weight: 700;
      }
      .ct-card__desc {
        color: var(--bl-text-secondary); font-size: 0.875rem; line-height: 1.5;
        margin-top: 0.6rem;
      }
      .ct-card__actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.9rem; }
      .ct-btn {
        display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.5rem 0.95rem;
        border-radius: var(--bl-radius-pill); text-decoration: none;
        font-size: 0.8125rem; font-weight: 700; white-space: nowrap;
        transition: transform .15s, box-shadow .15s, opacity .15s;
      }
      .ct-btn:hover { transform: translateY(-1px); opacity: 0.92; }
      .ct-btn--call { background: var(--bl-primary); color: #fff; box-shadow: var(--bl-shadow-sm); }
      .ct-btn--whatsapp { background: #25d366; color: #fff; box-shadow: var(--bl-shadow-sm); }

      .ct-empty {
        display: flex; flex-direction: column; align-items: center; gap: 0.6rem;
        text-align: center; padding: 2.5rem 1.5rem; color: var(--bl-text-secondary);
        background: var(--bl-surface); border: 1px dashed var(--bl-border);
        border-radius: var(--bl-radius-xl); font-size: 0.9375rem;
      }
      .ct-empty i { font-size: 1.75rem; color: var(--bl-text-muted); }

      .ct-cta {
        margin-top: 2rem; text-align: center; padding: 1.25rem;
        border: 1px dashed var(--bl-border); border-radius: var(--bl-radius-lg);
        color: var(--bl-text-secondary); font-size: 0.875rem;
      }
      .ct-cta a { color: var(--bl-primary); font-weight: 700; text-decoration: none; }
      .ct-cta a:hover { text-decoration: underline; }
    </style>
    <script type="module" crossorigin src="/assets/contratar-Wr889lns.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/speed-insights-CGQ9u1QN.js">
    <link rel="stylesheet" crossorigin href="/assets/home-CKkH04k6.css">
  </head>
  <body>
    <nav class="navbar" role="navigation" aria-label="Navegación principal">
      <div class="navbar__top">
        <a href="./home.html" class="navbar__logo">
          <img src="/assets/logoazulpng-BmcneNO6.png" alt="Baradero Local" class="navbar__logo-img" />
          <div class="navbar__logo-text">
            <span class="navbar__logo-title">Baradero Local</span>
            <span class="navbar__logo-subtitle">Baradero, más cerca que nunca</span>
          </div>
        </a>
        <div class="navbar__actions">
          <a href="./home.html" class="navbar__action-circle" aria-label="Volver al inicio"><i class="fa-solid fa-arrow-left"></i></a>
        </div>
      </div>
    </nav>

    <main class="ct-page">
      <div class="ct-hero">
        <span class="ct-hero__icon" aria-hidden="true"><i class="fa-solid fa-screwdriver-wrench"></i></span>
        <div>
          <h1 class="ct-hero__title">Contratar</h1>
          <p class="ct-hero__subtitle">Profesionales y técnicos de Baradero, para contratar por WhatsApp o teléfono.</p>
        </div>
      </div>

      <div class="ct-search">
        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
        <input type="search" id="ct-search-input" placeholder="Buscar por oficio o nombre (ej: plomero, clases...)" aria-label="Buscar profesionales" />
      </div>

      <!-- Poblado por js/contratar.js -->
      <div id="ct-content"></div>

      <p class="ct-cta">¿Sos profesional o técnico? <a href="./vender.html">Sumate al directorio</a>.</p>
    </main>

  </body>
</html>
