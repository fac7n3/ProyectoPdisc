name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Mínimo privilegio para el token del workflow (SOC 2 CC6.1 / CC8.1).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Tests (incluye CSP y headers de seguridad)
        run: npm test

      - name: Build
        run: npm run build

  dependencias:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Lo que llega al navegador: una vulnerabilidad alta frena el CI.
      - name: npm audit (producción)
        run: npm audit --omit=dev --audit-level=high

      # Herramientas de desarrollo (Vite, sharp, CLI de Supabase): se reporta,
      # no frena. Dependabot abre el PR para actualizarlas.
      - name: npm audit (desarrollo, informativo)
        run: npm audit --audit-level=high
        continue-on-error: true

  # Humo del sitio público en un navegador real (e2e/). Sirve el dist/ versionado
  # (ya trae la URL/clave públicas de Supabase) y NO escribe en la base: corta todo
  # lo que no sea lectura. Es un job aparte porque el build de arriba pisa dist/.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Pruebas e2e
        run: npm run test:e2e

      - name: Reporte (si falló)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
