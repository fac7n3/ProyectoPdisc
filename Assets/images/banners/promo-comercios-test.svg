<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Frente de un comercio">
  <!-- Imagen de PRUEBA para el espacio mosaic_f del segundo mosaico del home
       (ver CLAUDE.md: "Hoy no hay ningún espacio asignado"). Reemplazar por
       una foto real cuando haya una, o dejarla si sirve como banner fijo. -->
  <g fill="#ffffff">
    <!-- toldo (zigzag) -->
    <polygon points="150,140 190,140 170,180" opacity="0.96"/>
    <polygon points="190,140 230,140 210,180" opacity="0.8"/>
    <polygon points="230,140 270,140 250,180" opacity="0.96"/>
    <polygon points="270,140 310,140 290,180" opacity="0.8"/>
    <polygon points="310,140 350,140 330,180" opacity="0.96"/>
    <polygon points="350,140 390,140 370,180" opacity="0.8"/>
    <polygon points="390,140 430,140 410,180" opacity="0.96"/>
    <polygon points="430,140 470,140 450,180" opacity="0.8"/>
    <rect x="150" y="128" width="320" height="14" rx="4" opacity="0.96"/>

    <!-- frente del local -->
    <rect x="170" y="180" width="280" height="110" rx="6" opacity="0.96"/>

    <!-- vidrieras a los lados -->
    <rect x="190" y="200" width="60" height="60" rx="4" fill="#d90368"/>
    <rect x="370" y="200" width="60" height="60" rx="4" fill="#d90368"/>

    <!-- puerta -->
    <rect x="280" y="210" width="60" height="80" rx="4" fill="#d90368"/>
    <circle cx="325" cy="252" r="4" fill="#ffffff"/>

    <!-- cartel -->
    <rect x="260" y="100" width="100" height="26" rx="6" opacity="0.96"/>
  </g>
</svg>
